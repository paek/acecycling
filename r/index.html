<style>

    align-items: center;

<div class="container">

  <img class="app-icon" src="../icons/acecycling_icon_256.png" alt="ACE Cycling 앱 아이콘">

  <h1>ACE Cycling</h1>
  <div class="target" id="target">대회 경기일정</div>
  <p class="subtitle" id="subtitle">공유받은 대회의 경기일정·출전명단·결과를<br>ACE Cycling 앱에서 확인하세요.</p>

  <a class="cta-btn" id="openApp" href="#">ACE Cycling 앱에서 보기</a>
  <p class="hint" id="hint"></p>

  <p class="divider">앱이 없으신가요? 무료로 설치하세요</p>
  <div class="stores">
    <a class="store-btn" id="storeAndroid" href="https://play.google.com/store/apps/details?id=com.acegame.acecycling">Google Play</a>
    <a class="store-btn" id="storeIos" href="https://apps.apple.com/app/ace-cycling/id6799085855">App Store</a>
  </div>

  <div class="footer">
    <a href="../">acecycling.acegame.com</a><br>
    © 2026 ACEGame. All Rights Reserved.
  </div>

</div>

<script>
(function(){
  // 공유 링크: https://acecycling.acegame.com/r/?d=track&y=2026&id=<연맹 대회 번호> (경기일정) 또는 ?c=<대회 키> (대회 정보)
  // 앱이 설치돼 있으면 보통 이 페이지를 거치지 않고 앱이 바로 열린다(App Links / Universal Links).
  // 카카오톡 안 브라우저 등에서는 이 페이지가 열리므로 "앱에서 보기" 버튼이 앱 스킴(acecycling://r?…)으로 앱을 연다.
  var STORE = {
    android: 'https://play.google.com/store/apps/details?id=com.acegame.acecycling',
    ios: 'https://apps.apple.com/app/ace-cycling/id6799085855'
  };
  var LABELS = { road: '도로(ROAD)', track: '트랙(TRACK)', bmx: 'BMX' };

  var params = new URLSearchParams(window.location.search);
  var d = (params.get('d') || '').toLowerCase();
  var y = params.get('y') || '';
  var id = params.get('id') || '';
  // 대회 정보 공유 링크(?c=<대회 키>, 예: 2026:yeonsu-eco-bike-festival) — 동호회 대회 정보 화면에서 공유한 것.
  var c = params.get('c') || '';
  var isSchedule = Object.prototype.hasOwnProperty.call(LABELS, d) && /^\d{4}$/.test(y) && /^[A-Za-z0-9_-]{1,40}$/.test(id);
  var isCompetition = !isSchedule && /^[A-Za-z0-9:_.-]{1,80}$/.test(c);
  var valid = isSchedule || isCompetition;

  var ua = navigator.userAgent || '';
  var platform = 'desktop';
  if (/iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
    platform = 'ios';
  } else if (/android/i.test(ua)) {
    platform = 'android';
  }
  var inKakao = /KAKAOTALK/i.test(ua);

  window.dataLayer = window.dataLayer || [];
  function track(event, extra) {
    var data = { event: event, detected_platform: platform, in_kakao: inKakao, share_discipline: d, share_year: y, share_id: id, share_competition: c };
    for (var k in extra || {}) data[k] = extra[k];
    window.dataLayer.push(data);
  }
  track('share_link_open', { share_valid: valid, referrer: document.referrer || '(direct)' });

  var openApp = document.getElementById('openApp');
  var hint = document.getElementById('hint');
  var target = document.getElementById('target');

  if (platform === 'android') document.getElementById('storeAndroid').classList.add('recommended');
  if (platform === 'ios') document.getElementById('storeIos').classList.add('recommended');

  if (!valid) {
    target.textContent = '링크 정보가 올바르지 않습니다';
    document.getElementById('subtitle').innerHTML = 'ACE Cycling 앱을 설치하면<br>대회 일정·결과를 확인할 수 있습니다.';
    openApp.style.display = 'none';
  } else {
    var query;
    if (isSchedule) {
      target.textContent = y + ' ' + LABELS[d] + ' 대회 경기일정';
      query = 'd=' + encodeURIComponent(d) + '&y=' + encodeURIComponent(y) + '&id=' + encodeURIComponent(id);
    } else {
      target.textContent = (/^\d{4}:/.test(c) ? c.slice(0, 4) + ' ' : '') + '대회 정보';
      document.getElementById('subtitle').innerHTML = '공유받은 대회의 일정·장소·접수 정보를<br>ACE Cycling 앱에서 확인하세요.';
      query = 'c=' + encodeURIComponent(c);
    }
    var schemeUrl = 'acecycling://r?' + query;
    if (platform === 'android') {
      // 앱이 있으면 앱이 열리고, 없으면 Play 스토어로 간다.
      openApp.href = 'intent://r?' + query + '#Intent;scheme=acecycling;S.browser_fallback_url=' +
        encodeURIComponent(STORE.android) + ';end';
    } else if (platform === 'ios') {
      openApp.href = schemeUrl;
    } else {
      openApp.href = schemeUrl;
      hint.textContent = '휴대폰에서 링크를 열면 앱으로 바로 볼 수 있습니다.';
    }
    openApp.addEventListener('click', function(){
      track('share_open_app_click');
      if (platform !== 'ios') return;
      // iPhone: 앱이 없으면 페이지가 그대로 남는다 → 잠시 뒤 App Store 설치를 안내한다.
      var started = Date.now();
      setTimeout(function(){
        if (document.hidden || Date.now() - started > 3000) return;
        hint.innerHTML = '앱이 열리지 않았다면 아래 <b>App Store</b>에서 설치한 뒤 이 링크를 다시 눌러 주세요.';
      }, 1800);
    });
  }

  document.getElementById('storeAndroid').addEventListener('click', function(){ track('share_store_click', { store: 'google_play' }); });
  document.getElementById('storeIos').addEventListener('click', function(){ track('share_store_click', { store: 'app_store' }); });
})();
</script>

</body>
